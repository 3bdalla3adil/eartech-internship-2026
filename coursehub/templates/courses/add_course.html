{% extends "base.html" %}

{% block title %}Add Course | CourseHub{% endblock %}

{% block content %}
<div class="container py-4">
    <h2 class="mb-4">Add a Course</h2>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit" class="btn btn-primary">
            Save Course
        </button>
    </form>
</div>
{% endblock %}
